name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run check:motion
      - run: npm run check:scroll
      - run: npm run check:reply
      - run: npm run check:sleep
      # набор WAV для прослушивания (docs/sound-listening.md) — артефакт sound-wav прогона
      - run: npm run check:sound
        env:
          SOUND_WAV: sound-wav
          SOUND_WAV_SET: mix
      - uses: actions/upload-artifact@v4
        with:
          name: sound-wav
          path: sound-wav
          retention-days: 14
      - run: npm run build
      - run: node tools/export-design.js dist/design
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
