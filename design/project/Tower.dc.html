<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Башня</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./sedmaya.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&amp;family=PT+Serif:ital,wght@0,400;0,700;1,400&amp;family=Rubik+Mono+One&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="tw tw-dc" style="{{rootStyle}}" role="img" aria-label="{{alt}}">
<div style="{{innerStyle}}">
<sc-for list="{{back}}" as="p" hint-placeholder-count="4"><div class="{{p.c}}" style="{{p.s}}">{{p.t}}</div></sc-for>
<div style="{{tiltStyle}}">
<sc-for list="{{tower}}" as="p" hint-placeholder-count="12"><div class="{{p.c}}" style="{{p.s}}">{{p.t}}</div></sc-for>
</div>
<sc-for list="{{front}}" as="p" hint-placeholder-count="3"><div class="{{p.c}}" style="{{p.s}}">{{p.t}}</div></sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"preset":{"editor":"enum","options":["day2","good","bad","scars","harbor"],"default":"day2"},"scale":{"editor":"float","min":0.1,"max":3,"step":0.02,"default":1},"labels":{"editor":"boolean","default":false},"width":{"editor":"int","min":300,"max":4000,"default":900},"topm":{"editor":"int","min":0,"max":300,"default":0},"sky":{"editor":"boolean","default":true},"focus":{"editor":"enum","options":["","root","tier","spire"],"default":""},"part":{"editor":"enum","options":["tower","building"],"default":"tower"},"b":{"editor":"enum","options":["housing","farm","catcher","core","council","infirmary","guard","scrap","radio","corner","observatory","empty"],"default":"housing"},"stage":{"editor":"int","min":1,"max":3,"default":1},"state":{"editor":null},"$preview":{"width":900,"height":1400}}'>
/* Башня «Седьмая»: изображение из состояния игры (ТЗ §5.3, §7.2–7.4).
   renderTower(state, opts) — чистая функция без DOM: возвращает размеры и три слоя
   деталей {c: классы, s: координаты и стиль, t: подпись}. В игре тот же список
   рисуется на Canvas/Phaser; вид деталей описан классами .tw .* в sedmaya.css.
   Масштаб TOWER_K px на метр: ярус 10 м = 125 px, на крупном плане видны фасады,
   рамы, перила и жители.
   state = { altitude, mist, ether 0..1, stats {trust, solidarity, health, order},
             tiers [{kind: root|tier|spire, slots: ['farm' | {b: 'farm', stage: 1..3} | null]}],
             scars {patches [[ярус, доля ширины, доля высоты]], stumpAt, memorial} }
   opts  = { W, topM, labels } — вся башня; { part: 'building', slot, bw, bh } — одно здание.
   Возврат: { W, H, back, tower, front, boxes (рамки ярусов для крупного плана), count, tiltStyle }. */
var TOWER_K = 12.5;
var TW_GEOM = { wid: { root: 525, tier: 475, spire: 375 }, over: 24, truss: 14, deck: 12 };
var TW_ALIAS = { salvage: 'scrap', red_corner: 'corner' };
var TW_FIXED = { core: true, council: true };
var TW_NAMES = { core: 'Ядро', catcher: 'Уловитель', housing: 'Жилой', farm: 'Ферма', council: 'Совет', infirmary: 'Лазарет', guard: 'Стража', scrap: 'Разборка', radio: 'Радио', corner: 'Кр. уголок', observatory: 'Обсерватория' };
var TW_STAGES = ['', 'Времянка', 'Мастерская', 'Эфирная'];

var TOWER_PRESETS = {
  day2: {
    altitude: 60, mist: 23.1, ether: 0.85,
    stats: { trust: 68, solidarity: 69, health: 60, order: 54 },
    tiers: [
      { kind: 'root', slots: ['core', 'catcher', null] },
      { kind: 'tier', slots: [{ b: 'housing', stage: 2 }, 'housing', 'farm'] },
      { kind: 'spire', slots: ['council', null, null] }
    ]
  },
  good: {
    altitude: 90, mist: 38, ether: 1,
    stats: { trust: 84, solidarity: 78, health: 82, order: 74 },
    tiers: [
      { kind: 'root', slots: [{ b: 'core', stage: 3 }, { b: 'catcher', stage: 3 }, { b: 'catcher', stage: 2 }] },
      { kind: 'tier', slots: [{ b: 'housing', stage: 2 }, { b: 'farm', stage: 3 }, { b: 'infirmary', stage: 2 }] },
      { kind: 'tier', slots: [{ b: 'housing', stage: 2 }, { b: 'farm', stage: 2 }, { b: 'guard', stage: 2 }] },
      { kind: 'spire', slots: [{ b: 'council', stage: 3 }, { b: 'radio', stage: 2 }, { b: 'housing', stage: 1 }] }
    ]
  },
  bad: {
    altitude: 52, mist: 47.5, ether: 0.3,
    stats: { trust: 42, solidarity: 22, health: 26, order: 24 },
    tiers: [
      { kind: 'root', slots: ['core', 'catcher', 'scrap'] },
      { kind: 'tier', slots: [{ b: 'housing', stage: 2 }, 'housing', 'farm'] },
      { kind: 'tier', slots: ['housing', 'scrap', null] },
      { kind: 'spire', slots: ['council', { b: 'guard', stage: 2 }, null] }
    ]
  },
  scars: {
    altitude: 72, mist: 44, ether: 0.7,
    stats: { trust: 62, solidarity: 48, health: 58, order: 56 },
    tiers: [
      { kind: 'root', slots: ['core', { b: 'catcher', stage: 2 }, 'scrap'] },
      { kind: 'tier', slots: [{ b: 'housing', stage: 2 }, 'farm', { b: 'infirmary', stage: 2 }] },
      { kind: 'tier', slots: ['housing', { b: 'housing', stage: 2 }, 'guard'] },
      { kind: 'spire', slots: ['council', 'radio', null] }
    ],
    scars: { patches: [[0, 0.62, 0.15], [1, 0.12, 0.3], [1, 0.78, 0.2], [2, 0.45, 0.25]], stumpAt: 1, memorial: true }
  },
  harbor: {
    altitude: 96, mist: 41, ether: 0.95,
    stats: { trust: 78, solidarity: 74, health: 76, order: 66 },
    tiers: [
      { kind: 'root', slots: [{ b: 'core', stage: 3 }, { b: 'catcher', stage: 3 }, { b: 'catcher', stage: 3 }] },
      { kind: 'tier', slots: [{ b: 'housing', stage: 3 }, { b: 'farm', stage: 3 }, { b: 'infirmary', stage: 2 }] },
      { kind: 'tier', slots: [{ b: 'housing', stage: 2 }, { b: 'farm', stage: 3 }, { b: 'corner', stage: 2 }] },
      { kind: 'spire', slots: [{ b: 'council', stage: 3 }, { b: 'radio', stage: 3 }, { b: 'observatory', stage: 2 }] }
    ],
    scars: { patches: [[1, 0.7, 0.25], [2, 0.2, 0.2]], stumpAt: 1, memorial: true }
  }
};

function twHash(i) { var x = Math.sin(i * 12.9898 + 4.1) * 43758.5453; return x - Math.floor(x); }
function twClamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function twM(v) { var s = (Math.round(v * 10) / 10).toFixed(1).replace('.', ','); return s.slice(-2) === ',0' ? s.slice(0, -2) : s; }
// Слот: строка 'farm' (стадия 1, у Ядра и Совета — 2) или {b, stage}; пусто — null
function twSlot(v) {
  if (!v) return null;
  var b = typeof v === 'string' ? v : v.b;
  if (!b || b === 'empty') return null;
  b = TW_ALIAS[b] || b;
  var st = (typeof v === 'object' && v.stage) || (TW_FIXED[b] ? 2 : 1);
  return { b: b, stage: twClamp(Math.round(st), 1, 3) };
}

function renderTower(s, o) {
  o = o || {};
  var K = TOWER_K, U = K / 5, G = TW_GEOM, OV = G.over;
  var st = s.stats || { trust: 60, solidarity: 60, health: 60, order: 60 };
  var e = twClamp(s.ether == null ? 1 : s.ether, 0, 1), sc = s.scars || {};
  var labels = !!o.labels;
  var back = [], tower = [], front = [];
  var lit = twClamp((st.health - 15) / 70, 0, 1);
  var lowOrder = st.order < 35, lowSol = st.solidarity < 35, lowHealth = st.health < 35, lowTrust = st.trust < 35;
  var hiOrder = st.order >= 70, hiSol = st.solidarity >= 70, hiHealth = st.health >= 70, hiTrust = st.trust >= 70;
  var TINTS = ['#634734', '#486467', '#715441', '#174D5A', '#574336'];
  var CLOTH = ['#9A3335', '#255D6B', '#A26943', '#255D6B', '#255D6B', '#AE5700'];
  var close = false, winIdx = 0, figIdx = 0;

  function r1(v) { return Math.round(v * 10) / 10; }
  function px(L, c, x, yy, w, h, extra, t) {
    L.push({ c: 'p ' + c, s: 'left:' + r1(x) + 'px;top:' + r1(yy) + 'px;width:' + r1(w) + 'px;height:' + r1(h) + 'px;' + (extra || ''), t: t || '' });
  }
  function op(v) { return 'opacity:' + v.toFixed(2) + ';'; }
  // Тонкая деталь от точки к точке: трос, растяжка, верёвка
  function line(L, c, x1, y1, x2, y2, t) {
    var dx = x2 - x1, dy = y2 - y1, len = Math.sqrt(dx * dx + dy * dy), a = Math.atan2(dy, dx) * 180 / Math.PI;
    px(L, c, x1, y1 - t / 2, len, t, 'transform:rotate(' + a.toFixed(1) + 'deg);transform-origin:0 50%;');
  }
  // Житель: силуэт 9×22 px (1,75 м); x — центр, yb — пол. При высокой солидарности одежда разноцветная
  function fig(x, yb, cls, extra) {
    var i = figIdx++;
    var col = hiSol ? CLOTH[Math.floor(twHash(i + 31) * CLOTH.length)] : '#1A3437';
    px(tower, 'man' + (cls ? ' ' + cls : ''), x - 4.5, yb - 22, 9, 22, '--cc:' + col + ';' + (extra || ''));
  }
  function win(x, yy, w, h, ti, S) {
    var k = winIdx++;
    var cls = 'win w' + S + (twHash(k) < lit ? ' on' : '') + (lowOrder && twHash(k + 97) > 0.58 ? ' broken' : '') + (ti === 0 && close ? ' frost' : '');
    px(tower, cls, x, yy, w, h);
  }

  // Здание в слоте: x, y — левый верх, w × h, низ стоит на палубе. Стадия меняет материал:
  // 1 — доски, брезент, верёвки; 2 — металл, заклёпки, трубы; 3 — латунь, кристаллы, бирюзовое свечение
  function building(sl, x, y, w, h, ti) {
    function P(c, rx, ry, rw, rh, ex, t) { px(tower, c, x + rx, y + ry, rw, rh, ex, t); }
    function L(c, ax, ay, bx, by, t) { line(tower, c, x + ax, y + ay, x + bx, y + by, t); }
    if (!sl) { P('slot-empty', 0, 10, w, h - 10, '', '+'); return; }
    var b = sl.b, S = sl.stage, sS = ' s' + S;
    function shell(bc, rx, ry, rw, rh, noTop) {
      P('fac' + sS, rx, ry, rw, rh, '--bc:' + bc + ';');
      if (S === 1) {
        if (!noTop) {
          P('tarp', rx - 4, ry - 9, rw + 8, 15);
          L('rope', rx - 3, ry - 1, rx + 7, ry + 20, 1.5);
          L('rope', rx + rw + 3, ry - 1, rx + rw - 7, ry + 20, 1.5);
        } else P('cap1', rx - 2, ry - 4, rw + 4, 5);
      } else if (S === 2) {
        P('cap2', rx - 3, ry - 6, rw + 6, 7);
      } else {
        P('cap3', rx - 3, ry - 7, rw + 6, 8);
        if (!noTop) {
          P('crystal-glow', rx + rw / 2 - 16, ry - 30, 32, 32, op(0.3 + 0.7 * e));
          P('crystal', rx + rw / 2 - 5, ry - 21, 10, 14);
        }
      }
    }
    function grid(ax, ay, aw, ah, cols, rows, ww, wh, skip) {
      var gx = (aw - cols * ww) / (cols + 1), gy = (ah - rows * wh) / (rows + 1);
      for (var r = 0; r < rows; r++) for (var c = 0; c < cols; c++) {
        if (skip && skip(r, c)) continue;
        win(x + ax + gx + c * (ww + gx), y + ay + gy + r * (wh + gy), ww, wh, ti, S);
      }
      return { gx: gx, gy: gy };
    }

    if (b === 'housing') {
      shell('#CBA993', 0, 12, w, h - 12);
      var aw = w - 22, g = grid(4, 14, aw, h - 16, 3, 2, 20, 19, function (r, c) { return r === 1 && c === 1; });
      P('door d' + S, 4 + 2 * g.gx + 22, h - 27, 16, 27);
      var balY = 14 + g.gy + 19;
      fig(x + 4 + g.gx * 3 + 50, y + balY + 3, 'walk', '--walk:-14px;');
      P('rail r' + S, 4 + g.gx * 2 + 18, balY - 6, aw - 2 * g.gx - 16, 10);
      P('ladder l' + S, w - 14, 10, 9, h - 10);
      if (S === 2) {
        P('pipe', w * 0.72, -2, 8, 14); P('pipecap', w * 0.72 - 2, -5, 12, 4);
        P('ant', 12, -8, 2, 14);
        P('laundry', 13, -4, w * 0.72 - 15, 11);
      } else if (S === 1) P('laundry', 6, 22, w * 0.5, 11);
    }
    else if (b === 'farm') {
      // Теплица: стеклянный купол с рёбрами-меридианами на цоколе. Внутри два яруса растений разной
      // формы — сзади высокие кусты на шпалере, спереди круглые кочаны в лотке с бегущей водой.
      // 1 — деревянные рёбра, плёнка с заплатами, ящики и бочка; 2 — сталь, стекло, гидропоника
      // и тёплые лампы; 3 — латунь, эфирные лампы со световыми конусами, больше плодов.
      var dry = lowHealth ? ' dry' : '', dh = h - 16, fs = ' f' + S;
      P('dome-back d' + S, 3, 2, w - 6, dh);
      if (S >= 2) [0.33, 0.67].forEach(function (k) {
        P('lamp-cone' + (S === 3 ? ' ether' : ''), w * k - 20, 18, 40, dh - 30, op(S === 3 ? 0.35 + 0.65 * e : 1));
        P('hookline', w * k - 0.75, 7, 1.5, 9);
        P('growlamp' + (S === 3 ? ' ether' : ''), w * k - 9, 15, 18, 5);
      });
      P('plant tall' + fs + dry, 24, dh - 52, w - 48, 40);
      P('shelf' + fs, 18, dh - 13, w - 36, 5);
      P('plant leafy' + dry, 9, dh - 21, w - 18, 15);
      P('trough' + fs + dry, 8, dh - 7, w - 16, 7);
      if (S === 1) P('barrel', w - 26, dh - 15, 11, 15);
      fig(x + w * 0.7, y + dh);
      P('dome d' + S, 3, 2, w - 6, dh);
      P('dome-rib d' + S, 3 + (w - 6) * 0.19, 2, (w - 6) * 0.62, dh);
      P('dome-rib d' + S, 3 + (w - 6) * 0.37, 2, (w - 6) * 0.26, dh);
      if (S === 1) { L('rope', 2, h - 18, w * 0.3, 6, 1.5); L('rope', w - 2, h - 18, w * 0.7, 6, 1.5); }
      P('fac' + sS, 0, h - 16, w, 16, '--bc:#5b5f52;');
      P('pipeh p' + S, 0, h - 11, w, 5);
      if (S >= 2) P('valve', w - 18, h - 14, 10, 10);
    }
    else if (b === 'catcher') {
      var cx = w / 2;
      shell('#9D7D68', w * 0.18, h - 30, w * 0.64, 30, true);
      win(x + w * 0.18 + 9, y + h - 22, 14, 12, ti, S);
      win(x + w * 0.82 - 23, y + h - 22, 14, 12, ti, S);
      P('pylon y' + S, cx - 9, 16, 18, h - 46);
      P('ether-flow', cx - 2, 12, 4, h - 42, op(0.15 + 0.85 * e));
      if (S === 1) { L('rope', cx, 22, w * 0.2, h - 30, 1.5); L('rope', cx, 22, w * 0.8, h - 30, 1.5); }
      P('horn h' + S, cx - 38, -2, 76, 26);
      if (S >= 2) { P('ant', cx - 34, -6, 2, 20); P('ant', cx + 32, -4, 2, 18); P('ant-tip', cx - 36, -9, 6, 6); P('ant-tip', cx + 30, -7, 6, 6); }
      if (S === 3) P('crystal', cx - 6, 10, 12, 20);
      P('spark', cx - 15, -3, 30, 16, op(0.25 + 0.75 * e));
      fig(x + w * 0.1, y + h);
    }
    else if (b === 'core') {
      // Эфирный реактор: стеклянная сфера с вихрями света внутри и бьющимся сердцем, обручи кардана
      // (задняя половина за сферой, передняя перед ней), опоры от стен, постамент и световод в потолок.
      // 1 — один железный обруч на досках и верёвках; 2 — стальной кардан из двух обручей;
      // 3 — латунный кардан из трёх обручей с эфирной насечкой, кристаллы на опорах.
      var d = Math.min(w - 64, h - 18), ccx = w / 2, ccy = h / 2 - 1, cs = ' c' + S, R = d / 2;
      var eqW = d + 28, eqH = Math.round(eqW * 0.28), mW = Math.round((d + 12) * 0.36), mH = d + 12;
      var rings = [['eq', ccx - eqW / 2, ccy - eqH / 2, eqW, eqH, '']];
      if (S >= 2) rings.push(['mer', ccx - mW / 2, ccy - mH / 2, mW, mH, 'transform:rotate(24deg);']);
      if (S === 3) rings.push(['mer', ccx - mW / 2, ccy - mH / 2, mW, mH, 'transform:rotate(-24deg);animation-delay:-3s;']);
      P('core-halo', ccx - d * 0.95, ccy - d * 0.6, d * 1.9, d * 1.2, op(0.15 + 0.85 * e));
      P('pipeh p' + S, 0, h - 30, w, 9);
      P('core-conduit' + cs, ccx - 4, -10, 8, ccy - R + 12);
      P('core-flow', ccx - 1.5, -10, 3, ccy - R + 10, op(0.15 + 0.85 * e));
      P('core-arm' + cs, 2, ccy - 5, ccx - eqW / 2 + 2, 10);
      P('core-arm' + cs, ccx + eqW / 2 - 4, ccy - 5, w - 2 - (ccx + eqW / 2 - 4), 10);
      rings.forEach(function (r) { P('core-ring ' + r[0] + ' back' + cs, r[1], r[2], r[3], r[4], r[5]); });
      P('core' + cs, ccx - R, ccy - R, d, d, op(0.35 + 0.65 * e));
      P('core-swirl', ccx - d * 0.41, ccy - d * 0.41, d * 0.82, d * 0.82, op(0.2 + 0.8 * e));
      P('core-swirl rev', ccx - d * 0.41, ccy - d * 0.41, d * 0.82, d * 0.82, op(0.15 + 0.7 * e));
      P('core-heart', ccx - d * 0.2, ccy - d * 0.17, d * 0.4, d * 0.4, op(0.3 + 0.7 * e));
      P('core-glint', ccx - d * 0.33, ccy - d * 0.37, d * 0.3, d * 0.17, 'transform:rotate(-32deg);');
      rings.forEach(function (r) { P('core-ring ' + r[0] + ' front' + cs, r[1], r[2], r[3], r[4], r[5]); });
      P('core-pin', ccx - eqW / 2 - 3, ccy - 4, 8, 8);
      P('core-pin', ccx + eqW / 2 - 5, ccy - 4, 8, 8);
      P('core-cap' + cs, ccx - 9, ccy - R - 5, 18, 8);
      P('core-base b' + S, ccx - d * 0.42, ccy + R - 4, d * 0.84, h - (ccy + R - 4));
      P('gauge', 7, h - 27, 15, 15);
      if (S === 3) { P('crystal', 9, ccy - 21, 9, 16); P('crystal', w - 18, ccy - 21, 9, 16); }
      if (S === 1) { L('rope', ccx - R - 6, ccy + 3, ccx - d * 0.42, h - 8, 1.5); L('rope', ccx + R + 6, ccy + 3, ccx + d * 0.42, h - 8, 1.5); }
      fig(x + w - 12, y + h);
    }
    else if (b === 'council') {
      shell('#B32E35', 0, 18, w, h - 18, true);
      P('attic a' + S, w * 0.14, 3, w * 0.72, 16);
      P('emblem e' + S, w / 2 - 11, -2, 22, 22);
      P('star sm' + (S === 3 ? ' glow' : ''), w / 2 - 7, 2, 14, 14);
      P('council-t', 6, 21, w - 12, 13, '', 'СОВЕТ');
      P('pilasters', 6, 36, w - 12, h - 44);
      grid(6, 36, w - 12, h - 46, 3, 1, 14, 28, function (r, c) { return c === 1; });
      P('door d' + S, w / 2 - 9, h - 30, 18, 30);
      P('steps', w / 2 - 20, h - 6, 40, 6);
      fig(x + w * 0.3, y + h);
    }
    else if (b === 'infirmary') {
      // Лазарет. 1 — полевой госпиталь: палатка с красным крестом, тёмный проём с койкой, откинутый
      // полог, носилки у входа. 2–3 — больница: белый корпус с красной полосой, световой крест над
      // входом, палаты с койками в окнах, козырёк, пандус и носилки; 3 — латунь и эфирный крест.
      if (S === 1) {
        P('tent', 0, 6, w, h - 6);
        L('rope', 2, h - 2, w * 0.18, 26, 1.5); L('rope', w - 2, h - 2, w * 0.82, 26, 1.5);
        P('tent-cross', w / 2 - 10, 20, 20, 20);
        P('tent-door', w / 2 - 18, h - 40, 36, 40);
        P('ward', w / 2 - 12, h - 10, 24, 8);
        P('tent-flap', w / 2 + 4, h - 40, 18, 36);
      } else {
        shell('#E9E2CF', 0, 12, w, h - 12);
        [8, 26, w - 40, w - 22].forEach(function (wx) { win(x + wx, y + 17, 14, 13, ti, S); });
        P('cross-light' + (S === 3 ? ' ether' : ''), w / 2 - 12, 14, 24, 24);
        P('med-band', 0, 40, w, 5);
        [6, w - 36].forEach(function (wx) { win(x + wx, y + 48, 30, 18, ti, S); P('ward', wx + 3, 57, 24, 8); });
        P('awning', w / 2 - 18, h - 33, 36, 7);
        P('door d' + S, w / 2 - 9, h - 26, 18, 26);
        P('ramp', w / 2 + 9, h - 5, 22, 5);

    });
    var box = { kind: t.kind, x: x0 - OV - 40, y: yt - 30, w: w + 2 * OV + 80, h: h + 60 };
    if (top) box = spireRoof(t, w, x0, yt, yb);
    var inner = 12, slotW = (w - 2 * inner) / 3, by = yt + G.truss + 9, bh = yb - G.deck - by;
    t.slots.forEach(function (v, j) {
      var sx = x0 + inner + j * slotW, sl = twSlot(v);
      building(sl, sx + 3, by, slotW - 6, bh, i);
      if (labels) px(tower, 'slab' + (sl ? '' : ' empty'), sx + 10, yb - G.deck - 25, slotW - 20, 22, '', sl ? TW_NAMES[sl.b] : '+ слот');
    });
    px(tower, 'deck', x0 - OV, yb - G.deck, w + 2 * OV, G.deck + 4);
    px(tower, 'bracket l', x0 - OV, yb + 4, OV, 18);
    px(tower, 'bracket r', x0 + w, yb + 4, OV, 18);

    // Жители на балконе
    if (twHash(i + 5) > 0.35 && !lowHealth) fig(x0 + w + 12, yb - G.deck, 'walk', '--walk:-8px;animation-duration:' + (5 + i) + 's;');
    // Сады на балконах и плющ под палубой (здоровье)
    if (!top && hiHealth) {
      px(tower, 'bush', x0 - OV + 1, yb - G.deck - 15, 13, 15); px(tower, 'bush', x0 - OV + 9, yb - G.deck - 19, 12, 19);
      px(tower, 'bush', x0 + w + OV - 13, yb - G.deck - 14, 12, 14);
      px(tower, 'vine', x0 - OV, yb + 4, OV, 26); px(tower, 'vine', x0 + w, yb + 4, OV, 20);
    } else if (!top && lowHealth) {
      px(tower, 'bush dry', x0 - OV + 2, yb - G.deck - 10, 14, 10);
    }
    px(tower, 'rail', x0 - OV, yb - G.deck - 14, OV - 2, 14);
    px(tower, 'rail', x0 + w + 2, yb - G.deck - 14, OV - 2, 14);
    // Патрули с фонарями (порядок)
    if (hiOrder) {
      px(tower, 'lantern', x0 - OV + 4, yb + 6, 8, 12); px(tower, 'lantern', x0 + w + OV - 12, yb + 6, 8, 12);
      fig(x0 - OV + 12, yb - G.deck, 'guard walk', '--walk:6px;animation-duration:7s;');
    }
    // Гирлянда флажков под палубой верхнего яруса (солидарность)
    if (hiSol && !top) px(tower, 'garland', x0 + 12, yt + 1, w - 24, 16);
    if (i === 0) box = { kind: t.kind, x: liftX - 20, y: yt - 30, w: (x0 + w + OV + 40) - (liftX - 20), h: botY + 140 - (yt - 30) };
    boxes.push(box);
  });

  // Крыша Шпиля в три ступени, мачта с растяжками, звезда с гранями (доверие).
  // Рисуется до зданий Шпиля, чтобы антенны и герб стояли перед крышей.
  function spireRoof(t, w, x0, yt, yb) {
      var r1y = yt - 16, r2y = yt - 32, r3y = yt - 46;
      px(tower, 'roofstep', x0 + 8, r1y, w - 16, 16);
      px(tower, 'roofstep', x0 + 52, r2y, w - 104, 16);
      px(tower, 'roofstep hi', x0 + 100, r3y, w - 200, 14);
      // Шатёр под звезду, а не радиомачта: цоколь на верхней ступени, кирпичный барабан с часами,
      // галерея с огнями, фонарь-ротонда с тёплым светом, гранёный шатёр с золотыми рёбрами,
      // шар, шток и золотая чаша-венец, которая держит звезду между нижними лучами.
      var b0 = r3y - 10, ballY = b0 - 122;
      px(tower, 'spire-plinth', CX - 28, b0, 56, 10);
      px(tower, 'spire-drum', CX - 16, b0 - 26, 32, 26);
      px(tower, 'spire-clock', CX - 7, b0 - 21, 14, 14);
      px(tower, 'spire-gallery', CX - 21, b0 - 31, 42, 6);
      px(tower, 'avl', CX - 24, b0 - 37, 6, 6); px(tower, 'avl', CX + 18, b0 - 37, 6, 6, 'animation-delay:-1.2s;');
      px(tower, 'spire-lantern', CX - 11, b0 - 51, 22, 21);
      px(tower, 'spire-eave', CX - 15, b0 - 55, 30, 5);
      px(tower, 'spire-tent', CX - 13, b0 - 114, 26, 60);
      px(tower, 'ball', CX - 6, ballY, 12, 12);
      px(tower, 'star-stem', CX - 2, ballY - 6, 4, 8);
      // Правильная пятиконечная звезда: центр на 54,8 % высоты рамки, нижние лучи — на 95,2 %.
      // Норма — дышащий ореол, медленные лучи, блик по граням, искры на концах лучей; мигание —
      // сбоящий свет; погасшая — тёмная, без ореола.
      var mode = st.trust >= 60 ? '' : st.trust >= 30 ? ' blink' : ' off', cy = ballY - 27, my = cy + 20;
      var rt = cy - 0.5478 * 78, bt = cy - 0.5478 * 64;
      px(tower, 'star-halo' + mode, CX - 68, cy - 68, 136, 136);
      if (!mode) px(tower, 'star-rays', CX - 80, cy - 80, 160, 160);
      px(tower, 'star rim' + mode, CX - 39, rt, 78, 78);
      px(tower, 'star big' + mode, CX - 32, bt, 64, 64);
      if (!mode) {
        px(tower, 'star glint', CX - 32, bt, 64, 64);
        px(tower, 'star-flare', CX - 9, rt - 5, 18, 18);
        px(tower, 'star-flare', CX + 37 - 9, rt + 30.7 - 9, 18, 18, 'animation-delay:-2.6s;');
        px(tower, 'star-flare', CX - 23 - 9, rt + 74.3 - 9, 18, 18, 'animation-delay:-4.1s;');
      }
      px(tower, 'star-cup', CX - 14, cy + 12, 28, 11);
      if (hiTrust) {
        [x0 + 12, x0 + w - 15].forEach(function (fx, k) {
          px(tower, 'pole', fx, r1y - 54, 3, 54);
          px(tower, 'flag', fx + 3, r1y - 54, 36, 21, k ? 'animation-delay:-.7s;' : '');
        });
      }
      if (lowTrust) {
        fig(x0 + w + 6, yb - G.deck); fig(x0 + w + 14, yb - G.deck + 1); fig(x0 + w + 21, yb - G.deck);
        px(tower, 'placard', x0 + w + 8, yb - G.deck - 40, 16, 12, '', '!');
      }
      return { kind: t.kind, x: x0 - OV - 50, y: my - 100, w: w + 2 * OV + 100, h: yb + 30 - (my - 100) };
  }

  // Баррикады на балконах, ярусы разных цветов, надписи (солидарность)
  if (lowSol) {
    for (var i = 1; i < n; i++) {
      var jy = ym(A + 10 * i) - G.deck, jw = tw(i), jx = CX - jw / 2;
      [jx - OV + 1, jx + jw + 1].forEach(function (bx) {
        px(tower, 'crate', bx + 2, jy - 12, 13, 12);
        px(tower, 'plank', bx - 3, jy - 16, 30, 4, 'transform:rotate(28deg);');
        px(tower, 'plank', bx - 3, jy - 16, 30, 4, 'transform:rotate(-28deg);');
      });
      if (i < n - 1) px(tower, 'graffiti', jx + jw * 0.3, jy, 150, 14, 'transform:rotate(-3deg);', i % 2 ? 'НАШ ЯРУС' : 'ВЕРХ ДЛЯ ВЕРХНИХ?');
    }
  }
  // Транспарант (доверие)
  var bannerOn = n > 2 && (hiTrust || lowTrust), onStump = bannerOn && sc.stumpAt === 1;
  if (bannerOn) {
    var bx1 = CX + tw(1) / 2 + (onStump ? 90 : OV + 6), by1 = ym(A + 20) + (onStump ? 6 : 2);
    px(tower, 'rod', bx1 - 4, by1, 40, 4);
    if (hiTrust) px(tower, 'banner', bx1, by1 + 4, 30, 200, '', 'ВСЕ НА ВЫСОТУ');
    else px(tower, 'banner torn', bx1, by1 + 4, 30, 120, '', 'ВСЕ НА');
  }
  // Дым, костёр в бочке, толпа (порядок)
  if (lowOrder) {
    var t1 = Math.min(1, n - 1), w1 = tw(t1), x1 = CX - w1 / 2, yb1 = ym(A + 10 * t1) - G.deck;
    [[CX + w1 / 2 - 60, ym(A + 10 * (t1 + 1)) - 20], [CX - rootW / 2 + 24, ym(A + 10) - 20]].forEach(function (p) {
      for (var k = 0; k < 3; k++) px(front, 'smoke sd' + k, p[0], p[1], 44, 44);
    });
    px(tower, 'fire', x1 - OV + 2, yb1 - 30, 16, 18);
    px(tower, 'barrel', x1 - OV + 4, yb1 - 15, 12, 15);
    var rx = CX + rootW / 2 + 2, ry = botY - G.deck;
    fig(rx + 5, ry); fig(rx + 12, ry + 1); fig(rx + 19, ry);
  }
  // Серый налёт (здоровье)
  if (lowHealth) px(tower, 'film', CX - rootW / 2 - OV, topY - 60, rootW + 2 * OV, botY - topY + 60);

  // Обрубок балки с оборванными тросами, памятная табличка
  if (sc.stumpAt != null && tiers[sc.stumpAt]) {
    var sj = sc.stumpAt, sw = tw(sj), sy = ym(A + 10 * (sj + 1));
    px(tower, 'stump', CX + sw / 2 - 10, sy - 18, 132, 24);
    if (!(onStump && sj === 1)) px(tower, 'cable-hang', CX + sw / 2 + 108, sy + 4, 2, 64);
    px(tower, 'cable-hang', CX + sw / 2 + 64, sy + 4, 2, 40, 'transform:rotate(-8deg);');
    px(tower, 'cable-hang', CX + sw / 2 + 30, sy + 4, 2, 24, 'transform:rotate(14deg);');
    if (sc.memorial) {
      var mw = tiers[sj + 1] ? tw(sj + 1) : sw, mx = CX - mw / 2 - OV + 1;
      px(tower, 'memorial', mx, sy - G.deck - 30, 22, 28);
      px(tower, 'star sm', mx + 6, sy - G.deck - 26, 10, 10);
      px(tower, 'wreath', mx + 3, sy - G.deck - 14, 16, 10);
    }
  }

  // Мгла спереди и клубы у Корня
  mistLayer(front, 1);
  mistLayer(front, 2);
  px(front, 'underglow', 0, mY + 20 * U, W, H - mY);
  if (splash) {
    px(front, 'splash-glow', CX - 230, mY - 40, 460, 80, op(0.3 + 0.6 * e));
    px(front, 'splash', CX - 170, mY - 22, 340, 44, dur(2.6));
    px(front, 'splash', CX - 170, mY - 22, 340, 44, dur(2.6) + 'animation-delay:' + (-1.3 * pace).toFixed(2) + 's;');
  }
  if (close) {
    px(front, 'wisp', CX - 375, botY - 110, 750, 215);
    px(front, 'wisp', CX - 250, botY - 185, 425, 160, 'animation-duration:8s;');
  }

  // Подписи: высоты, ярусы, уровень Мглы
  if (labels) {
    for (var m = Math.ceil(M / 10) * 10; m <= A + 10 * n; m += 10) {
      px(front, 'tick', 20, ym(m), 25, 2); px(front, 'tick-t', 55, ym(m) - 17, 110, 35, '', m + ' м');
    }
    tiers.forEach(function (t, i) {
      var nm = t.kind === 'root' ? 'Корень' : t.kind === 'spire' ? 'Шпиль' : (i === 1 ? 'Нижний ярус' : 'Ярус ' + i);
      px(front, 'tier-name', CX + tw(i) / 2 + OV + 46, ym(A + 10 * i) - 82, 250, 40, '', nm);
    });
    px(front, 'mist-line', 0, mY, W, 2);
    px(front, 'mist-t', W - 475, mY - 55, 450, 40, '', 'Мгла · ' + twM(M) + ' м');
  }

  var tilt = e < 0.5 ? +((0.5 - e) * 8).toFixed(1) : 0;
  return {
    W: W, H: H, back: back, tower: tower, front: front, boxes: boxes,
    count: back.length + tower.length + front.length,
    tiltStyle: 'position:absolute;left:0;top:0;width:' + W + 'px;height:' + H + 'px;transform:rotate(' + tilt + 'deg);transform-origin:' + CX + 'px ' + botY + 'px;'
  };
}

class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    var s = p.state || TOWER_PRESETS[p.preset || 'day2'] || TOWER_PRESETS.day2;
    var sc = parseFloat(p.scale) || 1;
    var W = parseInt(p.width, 10) || 900;
    var topM = parseInt(p.topm, 10) || 0;
    var labels = p.labels === true || p.labels === 'true';
    var sky = !(p.sky === false || p.sky === 'false');
    var r, alt, box = null;
    if (p.part === 'building') {
      var slot = p.b && p.b !== 'empty' ? { b: p.b, stage: parseInt(p.stage, 10) || 1 } : null;
      r = renderTower(s, { part: 'building', slot: slot });
      alt = slot ? TW_NAMES[slot.b] + ', стадия «' + TW_STAGES[twSlot(slot).stage] + '»' : 'Пустой слот';
    } else {
      r = renderTower(s, { W: W, topM: topM || undefined, labels: labels });
      var f = p.focus, bx = r.boxes;
      if (f === 'root') box = bx[0]; else if (f === 'spire') box = bx[bx.length - 1]; else if (f === 'tier' && bx.length > 2) box = bx[1];
      alt = 'Башня: ' + s.tiers.length + ' яруса, днище ' + s.altitude + ' м, Мгла ' + twM(s.mist) + ' м';
    }
    var cw = box ? box.w : r.W, ch = box ? box.h : r.H, ox = box ? box.x : 0, oy = box ? box.y : 0;
    return {
      back: r.back, tower: r.tower, front: r.front, tiltStyle: r.tiltStyle, alt: alt,
      rootStyle: 'width:' + Math.round(cw * sc) + 'px;height:' + Math.round(ch * sc) + 'px;',
      innerStyle: 'position:absolute;left:0;top:0;width:' + r.W + 'px;height:' + r.H + 'px;transform:scale(' + sc + ') translate(' + (-ox) + 'px,' + (-oy) + 'px);transform-origin:0 0;' +
        (sky ? 'background:linear-gradient(180deg,#1A3437 0%,#20444E 48%,#4F6A6D 78%,#7E9B9E 100%);' : '')
    };
  }
}
</script>
