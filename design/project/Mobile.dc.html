<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Главный экран, телефон</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./sedmaya.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&amp;family=PT+Serif:ital,wght@0,400;0,700;1,400&amp;family=Rubik+Mono+One&amp;display=swap">
<style>
body{margin:0}
.tab{flex:1;min-height:44px;border:0;background:transparent;color:var(--muted);font-family:var(--f-ui);font-size:14px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;border-bottom:3px solid transparent}
.tab[aria-selected=true]{color:var(--text);border-bottom-color:var(--red)}
.tab:focus-visible{outline:2px solid var(--ochre);outline-offset:-2px}
</style>
</helmet>
<div class="sd" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: var(--ink);">
  <header style="display: flex; align-items: center; gap: 12px; padding: 10px 16px;">
    <div class="leaf" style="width: 52px; height: 52px; flex: none;">
      <div class="leaf-top" style="font-size: 8px; padding: 2px 0;">Окт · 1967</div>
      <div class="disp num" style="font-size: 20px; line-height: 26px;">20</div>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column;">
      <span style="font-size: 18px; font-weight: 600;">День 2 из 20</span>
      <span style="font-size: 12px; color: var(--muted);">Высота 60 м · Мгла 23,1 м</span>
    </div>
    <button class="ibtn" type="button" aria-label="Меню"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button>
  </header>

  <div class="num" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding: 0 16px 10px;">
    <div style="padding: 6px 8px; background: var(--ink-2); display: flex; flex-direction: column;"><span class="lbl" style="font-size: 10px;">Жители</span><span style="font-size: 18px; font-weight: 600;">28</span><span style="font-size: 11px; color: var(--warn);">8 без жилья</span></div>
    <div style="padding: 6px 8px; background: var(--ink-2); display: flex; flex-direction: column;"><span class="lbl" style="font-size: 10px;">Еда</span><span style="font-size: 18px; font-weight: 600;">37</span><span style="font-size: 11px; color: var(--bad);">−7</span></div>
    <div style="padding: 6px 8px; background: var(--ink-2); display: flex; flex-direction: column;"><span class="lbl" style="font-size: 10px;">Эфир</span><span style="font-size: 18px; font-weight: 600;">29</span><span style="font-size: 11px; color: var(--bad);">−2</span></div>
    <div style="padding: 6px 8px; background: var(--ink-2); display: flex; flex-direction: column;"><span class="lbl" style="font-size: 10px;">Матер.</span><span style="font-size: 18px; font-weight: 600;">45</span><span style="font-size: 11px; color: var(--muted);">±0</span></div>
  </div>

  <div style="position: relative; height: 392px; flex: none; overflow: hidden;">
    <dc-import name="Tower" preset="day2" width="560" scale="0.7" labels="{{yes}}" hint-size="392px,392px"></dc-import>
  </div>

  <section style="flex: 1; display: flex; flex-direction: column; background: var(--ink-2); border-top: 3px solid var(--red);">
    <div role="tablist" aria-label="Панели" style="display: flex; padding: 0 8px; border-bottom: 1px solid var(--line);">
      <button class="tab" role="tab" type="button" aria-selected="true">Шкалы</button>
      <button class="tab" role="tab" type="button" aria-selected="false">Фракции</button>
      <button class="tab" role="tab" type="button" aria-selected="false">Декреты</button>
      <button class="tab" role="tab" type="button" aria-selected="false">Ночь</button>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; padding: 14px 16px;">
      <div style="display: flex; flex-direction: column; gap: 4px; color: var(--good);"><div style="display: flex; justify-content: space-between; color: var(--text); font-size: 14px;"><span>Доверие</span><span class="num">68</span></div><div class="scale" style="height: 10px;"><div class="scale-fill" style="width: 68%;"></div></div></div>
      <div style="display: flex; flex-direction: column; gap: 4px; color: var(--good);"><div style="display: flex; justify-content: space-between; color: var(--text); font-size: 14px;"><span>Солидарность</span><span class="num">69</span></div><div class="scale" style="height: 10px;"><div class="scale-fill" style="width: 69%;"></div></div></div>
      <div style="display: flex; flex-direction: column; gap: 4px; color: var(--good);"><div style="display: flex; justify-content: space-between; color: var(--text); font-size: 14px;"><span>Здоровье</span><span class="num">60 <span style="color: var(--bad);">−4</span></span></div><div class="scale" style="height: 10px;"><div class="scale-fill" style="width: 60%;"></div></div></div>
      <div style="display: flex; flex-direction: column; gap: 4px; color: var(--warn);"><div style="display: flex; justify-content: space-between; color: var(--text); font-size: 14px;"><span>Порядок</span><span class="num">54</span></div><div class="scale" style="height: 10px;"><div class="scale-fill" style="width: 54%;"></div></div></div>
    </div>
    <div style="margin-top: auto; padding: 0 16px 18px;">
      <a class="btn" href="Event.dc.html" style="display: flex; width: 100%; box-sizing: border-box; min-height: 54px;">Завершить день</a>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { yes: true }; }
}
</script>
</body>
</html>
